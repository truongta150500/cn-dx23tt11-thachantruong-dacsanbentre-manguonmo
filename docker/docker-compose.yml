version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: thucpham_mysql
    restart: always
    environment:
      MYSQL_DATABASE: thucpham_bentree
      MYSQL_USER: bentre_user
      MYSQL_PASSWORD: Bentre@2026!
      MYSQL_ROOT_PASSWORD: Root@Bentre2026!
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    networks:
      - bentre_net

  wordpress:
    image: wordpress:6.8-php8.1-apache
    container_name: thucpham_web
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: thucpham_bentree
      WORDPRESS_DB_USER: bentre_user
      WORDPRESS_DB_PASSWORD: Bentre@2026!
    volumes:
      - wp_data:/var/www/html
    networks:
      - bentre_net

volumes:
  db_data:
  wp_data:

networks:
  bentre_net:
    driver: bridge
